# Замініть умовні *.scm_* на entity_id вашого запису.
type: "vertical-stack"
cards:
  - type: "tile"
    entity: "select.scm_operation_mode"
    name: "Статус автоматизації"
    icon: "mdi:air-conditioner"
    features_position: "bottom"
    tap_action:
      action: "more-info"
    features:
      - type: "select-options"
        style: "dropdown"
        options:
          - "disabled"
          - "observation"
          - "control"
          - "temporary_block"
  - type: "entities"
    title: "Стан і рішення"
    show_header_toggle: false
    state_color: true
    entities:
      - entity: "binary_sensor.scm_running"
        name: "Кондиціонер увімкнено"
      - entity: "sensor.scm_temperature"
        name: "Температура кімнати"
      - type: "attribute"
        entity: "sensor.scm_strategy_action"
        attribute: "target_temperature_c"
        name: "Ціль контролера"
        suffix: " °C"
        icon: "mdi:thermometer-check"
      - type: "attribute"
        entity: "sensor.scm_strategy_action"
        attribute: "ac_temperature_c"
        name: "Температура датчика кондиціонера"
        suffix: " °C"
        icon: "mdi:thermometer"
      - type: "attribute"
        entity: "sensor.scm_strategy_action"
        attribute: "temperature_offset_c"
        name: "Різниця: кондиціонер − кімната"
        suffix: " °C"
        icon: "mdi:thermometer"
      - type: "attribute"
        entity: "sensor.scm_strategy_action"
        attribute: "ac_target_temperature_c"
        name: "Розрахована ціль кондиціонера"
        suffix: " °C"
        icon: "mdi:thermometer"
      - type: "attribute"
        entity: "sensor.scm_strategy_action"
        attribute: "ac_set_temperature_c"
        name: "Встановлена ціль на кондиціонері"
        suffix: " °C"
        icon: "mdi:thermometer"
      - entity: "sensor.scm_strategy_action"
        name: "Рішення контролера"
      - entity: "sensor.scm_strategy_reason"
        name: "Причина рішення"
      - type: "section"
        label: "Що дозволяє або блокує роботу"
      - entity: "binary_sensor.scm_grid_available"
        name: "Мережа доступна"
      - entity: "binary_sensor.scm_energy_allowed"
        name: "Енергетичний дозвіл"
      - entity: "sensor.scm_energy_reason"
        name: "Причина енергетичного дозволу"
      - entity: "binary_sensor.scm_control_allowed"
        name: "Автоматичні команди дозволені"
      - entity: "binary_sensor.scm_demand"
        name: "Є температурна потреба"
      - entity: "binary_sensor.scm_manual_pause"
        name: "Тимчасове блокування"
      - type: "section"
        label: "Налаштування"
      - type: "button"
        name: "Температура, пороги заряду та джерела"
        icon: "mdi:cog"
        action_name: "Відкрити"
        tap_action:
          action: "navigate"
          navigation_path: "/config/integrations/integration/solar_climate_manager"
  - type: "conditional"
    conditions:
      - condition: "state"
        entity: "binary_sensor.scm_command_failed"
        state: "on"
    card:
      type: "entities"
      title: "⚠ Помилка команди"
      show_header_toggle: false
      entities:
        - entity: "sensor.scm_command_error"
          name: "Причина помилки"
  - type: "conditional"
    conditions:
      - condition: "state"
        entity: "select.scm_operation_mode"
        state: "temporary_block"
    card:
      type: "vertical-stack"
      cards:
        - type: "markdown"
          content: "**Тимчасове блокування.** Автоматичні команди призупинено. Після місцевої півночі HA повернеться попередній статус. Щоб зняти блокування зараз, виберіть інший статус нижче."
        - type: "entities"
          show_header_toggle: false
          entities:
            - entity: "select.scm_operation_mode"
              name: "Змінити статус / розблокувати"
  - type: "conditional"
    conditions:
      - condition: "or"
        conditions:
          - condition: "state"
            entity: "binary_sensor.scm_invalid_data"
            state: "on"
          - condition: "state"
            entity: "binary_sensor.scm_energy_data_invalid"
            state: "on"
    card:
      type: "entities"
      title: "⚠ Перевірте джерела даних"
      show_header_toggle: false
      entities:
        - entity: "binary_sensor.scm_invalid_data"
          name: "Проблема температури або кондиціонера"
        - entity: "binary_sensor.scm_energy_data_invalid"
          name: "Проблема енергетичних даних"
        - entity: "sensor.scm_energy_reason"
          name: "Причина енергетичного блокування"
  - type: "conditional"
    conditions:
      - condition: "state"
        entity: "sensor.scm_energy_reason"
        state: "soc_recovery"
    card:
      type: "markdown"
      content: "**Очікування відновлення заряду.** Без мережі кондиціонер не запуститься, доки заряд не досягне порога «Заряд для відновлення роботи». Обидва пороги показані в енергетичному балансі. Після відновлення також перевіряються сонячний баланс і мінімальна пауза між запусками."
  - type: "entities"
    title: "Енергетичний баланс"
    show_header_toggle: false
    entities:
      - entity: "sensor.scm_soc"
        name: "Заряд батареї"
      - type: "attribute"
        entity: "binary_sensor.scm_energy_allowed"
        attribute: "minimum_soc"
        name: "Заряд для зупинки"
        suffix: " %"
        icon: "mdi:battery-lock"
      - type: "attribute"
        entity: "binary_sensor.scm_energy_allowed"
        attribute: "restart_soc"
        name: "Заряд для відновлення роботи"
        suffix: " %"
        icon: "mdi:battery-check"
      - type: "attribute"
        entity: "binary_sensor.scm_energy_allowed"
        attribute: "grid_import_limit_w"
        name: "Ліміт імпорту (0 — без обмежень)"
        suffix: " W"
      - type: "attribute"
        entity: "binary_sensor.scm_energy_allowed"
        attribute: "grid_import_margin_w"
        name: "Запас за лімітом імпорту"
        suffix: " W"
      - type: "attribute"
        entity: "binary_sensor.scm_energy_allowed"
        attribute: "grid_import_limit_active"
        name: "Ліміт імпорту задано"
      - entity: "sensor.scm_pv_power"
        name: "Сонячна потужність"
      - entity: "sensor.scm_house_load_power"
        name: "Споживання без заряджання батареї"
      - entity: "sensor.scm_battery_power"
        name: "Батарея: + розряд / − заряд"
      - entity: "sensor.scm_grid_power"
        name: "Мережа: + імпорт / − експорт"
      - entity: "sensor.scm_solar_margin"
        name: "Поточний сонячний баланс"
      - entity: "sensor.scm_average_solar_margin"
        name: "Середній баланс за 10 хв"
      - entity: "sensor.scm_ac_power"
        name: "Виміряна потужність кондиціонера"
      - type: "attribute"
        entity: "sensor.scm_strategy_action"
        attribute: "estimated_ac_power_w"
        name: "Оцінка потужності кондиціонера"
        suffix: " W"
        icon: "mdi:flash"
  - type: "entities"
    title: "Таймери"
    show_header_toggle: false
    entities:
      - entity: "sensor.scm_seconds_to_start"
        name: "До можливого запуску"
      - entity: "sensor.scm_seconds_to_stop"
        name: "До можливої зупинки"
  - type: "history-graph"
    title: "Температура · 12 год"
    hours_to_show: 12
    entities:
      - entity: "sensor.scm_temperature"
        name: "Кімната"
  - type: "history-graph"
    title: "Потужність · 12 год"
    hours_to_show: 12
    entities:
      - entity: "sensor.scm_pv_power"
        name: "СЕС"
      - entity: "sensor.scm_house_load_power"
        name: "Споживання"
      - entity: "sensor.scm_battery_power"
        name: "Батарея"
      - entity: "sensor.scm_average_solar_margin"
        name: "Середній баланс"
  - type: "history-graph"
    title: "Заряд батареї · 12 год"
    hours_to_show: 12
    entities:
      - entity: "sensor.scm_soc"
        name: "SOC"
  - type: "history-graph"
    title: "Робота та дозволи · 12 год"
    hours_to_show: 12
    entities:
      - entity: "binary_sensor.scm_running"
        name: "Кондиціонер"
      - entity: "binary_sensor.scm_grid_available"
        name: "Мережа"
      - entity: "binary_sensor.scm_energy_allowed"
        name: "Енергетичний дозвіл"
      - entity: "binary_sensor.scm_manual_pause"
        name: "Тимчасове блокування"
